  e.preventDefault(); const msg = document.getElementById("msg"); msg.textContent = "Decrypting...";
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b(P.salt), iterations: P.iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b(P.iv)}, key, b(P.ct)));
    try { sessionStorage.setItem("fa_k", s64(await crypto.subtle.exportKey("raw", key))); } catch (_) {}
    document.open(); document.write(html); document.close();
  } catch (err) { msg.textContent = "Wrong password."; }
});
</script></body></html>
