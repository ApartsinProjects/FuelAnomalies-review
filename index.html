    const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b(P.iv)}, key, b(P.ct)));
    document.open(); document.write(html); document.close();
  } catch (err) { msg.textContent = "Wrong password."; }
});
